[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdb-iimt-miner"
version = "0.1.0"
description = "Resumable multilingual poster mining from TMDB with Hugging Face export"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "datasets>=3.2,<5",
  "hydra-core>=1.3,<2",
  "huggingface-hub>=0.34,<2",
  "ImageHash>=4.3,<5",
  "Pillow>=10,<14",
  "polars>=1.20,<2",
  "pyarrow>=18,<24",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
tmdb-iimt-mine = "run_miner:main"

[tool.setuptools]
py-modules = ["tmdb_asset_miner", "tmdb_pair_miner", "run_miner"]

[tool.setuptools.packages.find]
include = ["tmdb_iimt_miner*"]

[tool.setuptools.package-data]
"tmdb_iimt_miner.conf" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "UP"]
