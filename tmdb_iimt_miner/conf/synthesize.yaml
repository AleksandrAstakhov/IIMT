defaults:
  - _self_

pipeline:
  steps: [synthesize, validate]

input:
  translations: data/translations.jsonl
  backgrounds_dir: data/backgrounds

output:
  dir: synthetic_dataset
  manifest: assets.jsonl
  pairs_manifest: pairs.jsonl

generation:
  seed: 42
  width: 768
  height: 512
  variants_per_family: 1
  font_paths: []
  min_font_size: 28
  max_font_size: 84
  curve_amplitude_min: 20
  curve_amplitude_max: 100
  margin: 64
  stroke_width: 2
  shadow_offset: 4
  region_width: 190
  unsupported_script_policy: skip

split:
  train: 0.90
  validation: 0.05
  test: 0.05
  seed: 42

pairing:
  mode: pivot
  pivot_languages: [en-US, en]
  bidirectional: true

hf:
  repo: ${oc.env:HF_DATASET_REPO,null}
  token: ${oc.env:HF_TOKEN,null}
  private: true
  max_shard_size: 1GB

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
